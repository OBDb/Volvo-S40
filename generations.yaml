generations:
  - name: "First Generation"
    start_year: 1995
    end_year: 2004
    description: "The first-generation Volvo S40 was developed jointly with Mitsubishi and shared its platform with the Mitsubishi Carisma. Built at the Nedcar factory in Born, Netherlands, it replaced the 440/460 series as Volvo's entry into the compact executive car segment. The S40 (saloon) and V40 (estate) were introduced in 1995, named after Volvo's naming convention conflict with Audi's S4. The design featured Peter Horbury's signature styling—characteristically Volvo but with softer, more rounded lines than previous models. Power came from four-cylinder engines including 1.6L, 1.8L, and 2.0L petrol options plus a Renault-sourced 1.9L turbodiesel. The T4 high-performance variant offered up to 200 horsepower. Safety was paramount with dual front airbags, SIPS (Side Impact Protection System), and curtain airbags. A major facelift in 2000 (Phase II) brought improved engine management, diesel direct injection, larger brakes, revised suspension, and updated styling. Another update in late 2002 introduced the distinctive 'egg crate' grille, new steering wheel, and enhanced safety features. The S40 was the first Volvo to earn a four-star Euro-NCAP safety rating and achieved notable motorsport success, including Rickard Rydell's 1998 BTCC championship."

  - name: "Second Generation"
    start_year: 2003
    end_year: 2012
    description: "The second-generation Volvo S40 marked a complete redesign using the Volvo P1 platform (also used by Ford Focus and Mazda3), built at Volvo's Ghent, Belgium factory. Unveiled at the September 2003 Frankfurt Motor Show with production starting October 2003, it went on sale as a '2004.5' model year vehicle. The design featured a more aerodynamic and modern aesthetic while maintaining Volvo's identity, with designer Fedde Talsma leading the exterior development. Inside, the innovative 'floating' center console became a Volvo signature, creating clever storage space. Engine choices expanded to include five-cylinder units alongside four-cylinders—the T5 turbocharged five-cylinder produced up to 227 horsepower. Front-wheel drive was standard, with optional all-wheel drive on certain variants. The S40 received a facelift in April 2007 featuring improved audio systems, increased storage, emergency brake lights, and optional active bi-xenon headlights and BLIS blind-spot monitoring. Production ended in May 2012, replaced by the V40 hatchback. Total production across both generations reached 602,910 units. The S40 earned the 2005 Canadian Car of the Year Best New Sport Compact and South African Car of the Year awards."
